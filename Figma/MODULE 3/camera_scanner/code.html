            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }

            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 0%; }

        }

<body class="bg-background text-on-background font-body-md overflow-hidden h-screen w-full flex flex-col">
<!-- TopAppBar Shell -->
<header class="bg-surface dark:bg-on-surface flex items-center justify-between px-margin-mobile w-full h-16 z-50 fixed top-0 left-0">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed hover:bg-surface-container dark:hover:bg-tertiary-container p-2 rounded-full Active: scale-95 transition-transform">

</button>
<h1 class="font-headline-sm text-headline-sm-mobile font-bold text-primary dark:text-primary-fixed">MedVerify</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container dark:hover:bg-tertiary-container p-2 rounded-full Active: scale-95 transition-transform" id="flash-toggle">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</div>

<!-- Main Camera Canvas -->

</div>
<!-- Scanning Overlay Layer -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center">
<!-- Scanning Frame Container -->
<div class="relative w-64 h-64 md:w-80 md:h-80 scanner-guide border-2 border-primary-fixed rounded-xl overflow-hidden">
<!-- Corner Accents -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Animated Scan Line -->
<div class="scanning-line absolute left-0 right-0 h-0.5 bg-primary shadow-[0_0_10px_rgba(0,61,155,0.8)] z-20"></div>
</div>
<!-- Instruction Text -->

<!-- Bottom Navigation Shell - Suppressed for task focus per "The Filter" rule -->
<!-- However, the prompt says "History" and "Settings" exist in global nav. Since this is an immersive scan mode, we suppress it for maximum canvas as per instructions. -->
<script>
        // Micro-interactions
        const shutterBtn = document.getElementById('shutter');
        const flashBtn = document.getElementById('flash-toggle');
        let flashOn = false;

        shutterBtn.addEventListener('click', () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-75';
            document.body.appendChild(flash);
            
            setTimeout(() => flash.classList.replace('opacity-0', 'opacity-100'), 50);
            setTimeout(() => flash.classList.replace('opacity-100', 'opacity-0'), 150);
            setTimeout(() => flash.remove(), 300);

            // Simple vibration simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        });

        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('span');
            if (flashOn) {
                icon.innerText = 'flash_off';
                icon.setAttribute('data-icon', 'flash_off');
                flashBtn.classList.add('text-primary');
            } else {
                icon.innerText = 'flash_on';
                icon.setAttribute('data-icon', 'flash_on');
                flashBtn.classList.remove('text-primary');
            }
        });

        // Toggle Scanning Line Visibility
        setInterval(() => {
            const line = document.querySelector('.scanning-line');
            line.style.opacity = line.style.opacity === '0.2' ? '1' : '0.2';
        }, 1500);
    </script>
