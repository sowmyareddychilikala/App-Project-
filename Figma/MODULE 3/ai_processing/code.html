<script>
        // Micro-interaction: Progress bar simulation
        const progress = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-label');
        const statuses = [
            'Loading Neural Models',
            'Identifying Borders',
            'Enhancing Contrast',
            'Recognizing Typography',
            'Validating Batch Codes',
            'Finalizing Results'
        ];
        
        let width = 15;
        let statusIdx = 0;

        const interval = setInterval(() => {
            if (width >= 98) {
                clearInterval(interval);
                statusText.innerText = 'Analysis Complete';
            } else {
                width += Math.random() * 8;
                if (width > 100) width = 98;
                progress.style.width = width + '%';
                
                // Update status text based on progress
                statusIdx = Math.floor((width / 100) * statuses.length);
                if (statuses[statusIdx]) {
                    statusText.innerText = statuses[statusIdx];
                }
            }
        }, 800);
    </script>
