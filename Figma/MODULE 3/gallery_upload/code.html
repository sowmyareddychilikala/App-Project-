<!-- Micro-interaction Script -->
<script>
        function toggleSelection(element) {
            const overlay = element.querySelector('.selection-overlay');
            if (overlay) {
                const isSelected = overlay.classList.contains('opacity-100');
                if (isSelected) {
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');
                } else {
                    overlay.classList.remove('opacity-0');
                    overlay.classList.add('opacity-100');
                }
            } else {
                // Add overlay if it doesn't exist (simplified for demo)
                const newOverlay = document.createElement('div');
                newOverlay.className = "absolute inset-0 selection-overlay border-4 border-primary opacity-100 flex items-start justify-end p-2 pointer-events-none transition-opacity";
                newOverlay.innerHTML = `
                    <div class="bg-primary text-on-primary rounded-full w-6 h-6 flex items-center justify-center shadow-md">
                        <span class="material-symbols-outlined text-[16px] font-bold" data-icon="check">check</span>
                    </div>
                `;
                element.appendChild(newOverlay);
            }
            
            // Trigger haptic feel
            if (window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }
    </script>
